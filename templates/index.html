<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自选股行情看板</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📈</span>
      <div>
        <h1>自选股行情看板</h1>
        <p class="subtitle">A 股实时行情 · 数据源自动切换</p>
      </div>
    </div>
    <div class="status" id="status">
      <span class="pill" id="pill-source">数据源 --</span>
      <span class="pill" id="pill-time">更新 --</span>
      <span class="pill" id="pill-countdown">--s 后刷新</span>
      <button class="btn" id="btn-refresh" type="button">立即刷新</button>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="card-head">
        <h2>行情列表</h2>
        <input id="filter" class="filter" type="search" placeholder="按代码或名称筛选…">
      </div>
      <div id="banner" class="banner hidden"></div>
      <div class="table-wrap">
        <table id="quote-table">
          <thead>
            <tr>
              <th>代码</th><th>名称</th>
              <th class="num">现价</th><th class="num">涨跌幅</th><th class="num">涨跌额</th>
              <th class="num">标记</th>
            </tr>
          </thead>
          <tbody id="quote-body">
            <tr><td colspan="6" class="empty">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>涨跌幅告警</h2>
        <span class="hint">阈值 ±{{ threshold }}%</span>
      </div>
      <ul id="alert-list" class="alerts">
        <li class="empty">暂无告警</li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <span>刷新间隔 {{ interval }}s</span>
    <span>·</span>
    <span>数据仅供参考，不构成投资建议</span>
  </footer>

  <script>window.APP_CONFIG = { interval: {{ interval }} };</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
